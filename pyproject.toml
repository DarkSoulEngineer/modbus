[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modbus"
version = "1.1.0"
description = "MODBUS for dummies. TCP/UDP/RTU/ASCII/TLS + rich terminal UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DarkSoulEngineer" }]
keywords = ["modbus", "cli", "industrial", "iot", "scada", "plc", "rtu", "automation", "rich"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "pymodbus>=3.5",
    "rich>=13.0",
]

[project.optional-dependencies]
# Enable the full-screen watch TUI dashboard (requires a venv / pip install -e '.[tui]').
tui = ["textual>=0.50"]

[project.urls]
Homepage = "https://github.com/19bk/modbus-cli"
Repository = "https://github.com/DarkSoulEngineer/modbus"

[project.scripts]
modbus = "modbus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["modbus*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
